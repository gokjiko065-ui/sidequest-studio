<!DOCTYPE html>
<html>
    <head>
        <title>Sidequest Studio</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1 id="logo">
            Sidequest Studio
        </h1>
        <p id="intro">
            Sidequest Studio serves up playful website-building challenges whenever you need a spark. Choose a difficulty, get a challenge, and turn a random idea into something real.
        </p>
        <h2>
            Select the difficulty
        </h2>
        <div id="difficulty">
            <button id="begginer-el">Beginner</button>
            <button id="Intermediate-el">Intermediate</button>
            <button id="Advanced-el">Advanced</button>
            <button id="Expert-el">Expert</button>
        </div>
        <button id="Generate">Generate Sidequest</button>
        <div class="card">
            <p id="title"></p>
            <p id="description"></p>
            <p id="features"></p>
            <p id="bonus"></p>
        </div>


        <script src="script.js"></script>
    </body>
</html>
